# Render's free plan puts the site to sleep after 15 minutes with no visitors, and the next
# guest then sees Render's loading page. Visiting it regularly keeps it awake.
# GitHub can run scheduled jobs late, so this makes the loading page unlikely, not impossible.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the site
        run: >
          curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors
          --max-time 90 --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n"
          https://thezurixperience.onrender.com/health
