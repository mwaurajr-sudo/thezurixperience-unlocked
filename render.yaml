services:
  # One service: render-start.mjs serves the site and the backend API together.
  # Fill the secrets in the Render dashboard.
  - type: web
    name: thezurixperience
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_SITE_URL
        value: https://thezurixperience.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: INVITE_EMAIL_SERVICE
        value: gmail
      - key: INVITE_EMAIL_USER
        sync: false
      - key: INVITE_EMAIL_PASSWORD
        sync: false
      - key: INVITE_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
